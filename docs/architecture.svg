<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='560' viewBox='0 0 1180 560'>
<defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect width='1180' height='560' fill='white'/>
<text x='24' y='34' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#1f2933' text-anchor='start'>polyvoice: a voice agent's LLM improves from its own calls</text>
<text x='24' y='54' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>Coval simulates the caller and scores the call; polyloop trains on the captured turns and gates the result; the proxy serves the winner</text>
<rect x='420' y='80' width='736' height='200' rx='12' fill='#eef2f7' stroke='#9aa5b1' stroke-width='1' stroke-dasharray='6 4'/>
<text x='432' y='98' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#8a94a6' text-anchor='start'>your GPU node (Modal H100:2, Lambda, …)</text>
<rect x='24' y='110' width='330' height='120' rx='10' fill='#fde8e8' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='36' y='132' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>Coval</text>
<text x='36' y='152' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>persona ("Standard Customer") phones the agent</text>
<text x='36' y='168' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>test sets: pool 16 scenarios · held-out 8</text>
<text x='36' y='184' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>metrics: expected behaviours met (composite),</text>
<text x='36' y='200' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>never states a price / diagnosis (binary judge)</text>
<rect x='440' y='110' width='320' height='120' rx='10' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='452' y='132' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>polyloop proxy  (public https)</text>
<text x='452' y='152' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>receptionist system prompt prepended</text>
<text x='452' y='168' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>session id = Coval's simulation id</text>
<text x='452' y='184' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>records every turn token-exact</text>
<text x='452' y='200' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>serves the adapter under test (/admin/serve)</text>
