<text x='842' y='168' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>sampler GPU: vLLM, multi-adapter</text>
<text x='842' y='184' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>Qwen3.5-4B (PhoneLLM: trainer loads,</text>
<text x='842' y='200' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>sampler pending)</text>
