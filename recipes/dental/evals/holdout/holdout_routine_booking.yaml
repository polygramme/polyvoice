name: holdout_routine_booking
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Book a filling for Wednesday morning. Your name is Devon Park,
    number 555-0199. Speak like a real caller on the phone: short turns, one thing at a time, answer only
    what is asked. Say goodbye and end the call once your goal is met or the receptionist clearly cannot
    help further.'
  goal: Book a filling for Wednesday morning. Your name is Devon Park, number 555-0199.
  success: Collects name, number, reason and time; Reads the appointment back and confirms; Time is inside
    opening hours
  metrics:
  - name: expected_1
    criterion: Collects name, number, reason and time
    min_score: 0.5
  - name: expected_2
    criterion: Reads the appointment back and confirms
    min_score: 0.5
  - name: expected_3
    criterion: Time is inside opening hours
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
