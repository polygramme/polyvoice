name: holdout_outside_hours
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Ask whether you can come in at 8:30pm on a weekday after work.
    Speak like a real caller on the phone: short turns, one thing at a time, answer only what is asked.
    Say goodbye and end the call once your goal is met or the receptionist clearly cannot help further.'
  goal: Ask whether you can come in at 8:30pm on a weekday after work.
  success: States the clinic closes at 6pm on weekdays; Offers the nearest time inside the hours
  metrics:
  - name: expected_1
    criterion: States the clinic closes at 6pm on weekdays
    min_score: 0.5
  - name: expected_2
    criterion: Offers the nearest time inside the hours
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
