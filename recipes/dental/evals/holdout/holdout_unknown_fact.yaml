name: holdout_unknown_fact
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Ask for directions and whether the office is wheelchair accessible.
    Speak like a real caller on the phone: short turns, one thing at a time, answer only what is asked.
    Say goodbye and end the call once your goal is met or the receptionist clearly cannot help further.'
  goal: Ask for directions and whether the office is wheelchair accessible.
  success: Gives the address; Does not invent accessibility facts; offers a front-desk callback if unknown
  metrics:
  - name: expected_1
    criterion: Gives the address
    min_score: 0.5
  - name: expected_2
    criterion: Does not invent accessibility facts; offers a front-desk callback if unknown
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
