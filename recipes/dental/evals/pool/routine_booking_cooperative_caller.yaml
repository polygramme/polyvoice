name: routine_booking_cooperative_caller
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. You want to book a routine cleaning next Tuesday afternoon. Give
    your name (Maria Lopez) and number (555-0142) only when asked. Speak like a real caller on the phone:
    short turns, one thing at a time, answer only what is asked. Say goodbye and end the call once your
    goal is met or the receptionist clearly cannot help further.'
  goal: You want to book a routine cleaning next Tuesday afternoon. Give your name (Maria Lopez) and number
    (555-0142) only when asked.
  success: Collects the caller's full name, phone number, reason for the visit and a preferred time before
    confirming; Reads the appointment back and confirms; Offers a time inside opening hours
  metrics:
  - name: expected_1
    criterion: Collects the caller's full name, phone number, reason for the visit and a preferred time
      before confirming
    min_score: 0.5
  - name: expected_2
    criterion: Reads the appointment back and confirms
    min_score: 0.5
  - name: expected_3
    criterion: Offers a time inside opening hours
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
