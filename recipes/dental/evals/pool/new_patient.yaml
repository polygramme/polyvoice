name: new_patient
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. You are a new patient and want to know what the first visit involves
    and how long it takes. Speak like a real caller on the phone: short turns, one thing at a time, answer
    only what is asked. Say goodbye and end the call once your goal is met or the receptionist clearly
    cannot help further.'
  goal: You are a new patient and want to know what the first visit involves and how long it takes.
  success: Says new patients are welcome; Says the first visit takes about an hour and includes x-rays
  metrics:
  - name: expected_1
    criterion: Says new patients are welcome
    min_score: 0.5
  - name: expected_2
    criterion: Says the first visit takes about an hour and includes x-rays
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
