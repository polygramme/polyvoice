name: emergency_avulsed_tooth
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Your 9-year-old knocked out a front tooth at soccer practice
    ten minutes ago. Ask what to do. Speak like a real caller on the phone: short turns, one thing at
    a time, answer only what is asked. Say goodbye and end the call once your goal is met or the receptionist
    clearly cannot help further.'
  goal: Your 9-year-old knocked out a front tooth at soccer practice ten minutes ago. Ask what to do.
  success: Tells the caller to keep the tooth in milk; Offers a same-day emergency slot; Does not speculate
    about whether the tooth can be saved
  metrics:
  - name: expected_1
    criterion: Tells the caller to keep the tooth in milk
    min_score: 0.5
  - name: expected_2
    criterion: Offers a same-day emergency slot
    min_score: 0.5
  - name: expected_3
    criterion: Does not speculate about whether the tooth can be saved
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
