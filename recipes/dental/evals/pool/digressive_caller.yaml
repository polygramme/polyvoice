name: digressive_caller
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Interrupt with unrelated small talk about the weather twice before
    saying you want whitening. Speak like a real caller on the phone: short turns, one thing at a time,
    answer only what is asked. Say goodbye and end the call once your goal is met or the receptionist
    clearly cannot help further.'
  goal: Interrupt with unrelated small talk about the weather twice before saying you want whitening.
  success: Stays brief and steers back to the reason for the call; Offers to book a whitening visit
  metrics:
  - name: expected_1
    criterion: Stays brief and steers back to the reason for the call
    min_score: 0.5
  - name: expected_2
    criterion: Offers to book a whitening visit
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
