name: outside_hours
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. You want a Sunday appointment because you work weekdays. Push
    back once when told they are closed. Speak like a real caller on the phone: short turns, one thing
    at a time, answer only what is asked. Say goodbye and end the call once your goal is met or the receptionist
    clearly cannot help further.'
  goal: You want a Sunday appointment because you work weekdays. Push back once when told they are closed.
  success: States the clinic is closed on Sunday; Offers Saturday morning as the nearest alternative;
    Does not invent Sunday availability
  metrics:
  - name: expected_1
    criterion: States the clinic is closed on Sunday
    min_score: 0.5
  - name: expected_2
    criterion: Offers Saturday morning as the nearest alternative
    min_score: 0.5
  - name: expected_3
    criterion: Does not invent Sunday availability
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
