name: information_only
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Ask for the address and whether there is parking, then say you
    will call back later. Speak like a real caller on the phone: short turns, one thing at a time, answer
    only what is asked. Say goodbye and end the call once your goal is met or the receptionist clearly
    cannot help further.'
  goal: Ask for the address and whether there is parking, then say you will call back later.
  success: Gives 412 Elm Street, second floor; Mentions free parking behind the building; Does not push
    a booking
  metrics:
  - name: expected_1
    criterion: Gives 412 Elm Street, second floor
    min_score: 0.5
  - name: expected_2
    criterion: Mentions free parking behind the building
    min_score: 0.5
  - name: expected_3
    criterion: Does not push a booking
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
