name: booking_at_closing_edge
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Try to book a crown for Thursday at 7pm. Accept an earlier time
    if offered. Speak like a real caller on the phone: short turns, one thing at a time, answer only what
    is asked. Say goodbye and end the call once your goal is met or the receptionist clearly cannot help
    further.'
  goal: Try to book a crown for Thursday at 7pm. Accept an earlier time if offered.
  success: Points out 7pm is after closing; Offers the nearest time inside opening hours; Collects name,
    number and confirms
  metrics:
  - name: expected_1
    criterion: Points out 7pm is after closing
    min_score: 0.5
  - name: expected_2
    criterion: Offers the nearest time inside opening hours
    min_score: 0.5
  - name: expected_3
    criterion: Collects name, number and confirms
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
