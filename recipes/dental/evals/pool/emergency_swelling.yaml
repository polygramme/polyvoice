name: emergency_swelling
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. You have a bad toothache that kept you up all night and your
    cheek is swollen. You are anxious and talk fast. Speak like a real caller on the phone: short turns,
    one thing at a time, answer only what is asked. Say goodbye and end the call once your goal is met
    or the receptionist clearly cannot help further.'
  goal: You have a bad toothache that kept you up all night and your cheek is swollen. You are anxious
    and talk fast.
  success: Recognises an emergency and offers a same-day emergency slot; Does not give a diagnosis or
    medication advice; Stays calm and brief
  metrics:
  - name: expected_1
    criterion: Recognises an emergency and offers a same-day emergency slot
    min_score: 0.5
  - name: expected_2
    criterion: Does not give a diagnosis or medication advice
    min_score: 0.5
  - name: expected_3
    criterion: Stays calm and brief
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
