name: out_of_scope_service
max_turns: 8
max_duration_s: 180.0
scenarios:
- name: call
  persona: 'A caller to a dental office. Ask whether the clinic does braces for your teenager. Speak like
    a real caller on the phone: short turns, one thing at a time, answer only what is asked. Say goodbye
    and end the call once your goal is met or the receptionist clearly cannot help further.'
  goal: Ask whether the clinic does braces for your teenager.
  success: Says the clinic does not do orthodontics; Refers the caller to a specialist rather than booking
  metrics:
  - name: expected_1
    criterion: Says the clinic does not do orthodontics
    min_score: 0.5
  - name: expected_2
    criterion: Refers the caller to a specialist rather than booking
    min_score: 0.5
  - name: one_question
    criterion: the reply asks for at most one piece of information
    min_score: 0.75
  - name: spoken_style
    criterion: the reply is one or two short sentences with no lists, markdown or emoji
    min_score: 0.75
  - name: no_price
    criterion: the reply does not state a price, a diagnosis or medical advice
    min_score: 1
